[package]
name = "pproxy"
version = "2.0.6"
edition = "2024"

[dependencies]
pingora = { version = "0.9.1", features = ["lb", "default", "rustls", "proxy", "time"] }
async-trait = "0.1.92"
log = "0.4.35"
tokio = { version = "1.54.1", features = ["full"]}
clap = {version = "4.6.8", features = ["env", "default", "derive"]}
dotenvy = "0.15.7"
tracing = { version = "0.1.44", features = ["async-await"]}
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time", "time"] }
thiserror = "2.0.21"
askama = "0.15.6"
serde = { version = "1.0.229", features = ["derive"] }
time = "0.3.55"
itertools = "0.14.0"
reqwest = { version = "0.13.5", features = ["json"] }
config = "0.15.27"
num_cpus = "1.17.0"
serde_json = "1.0.154"
tower-http = { version = "0.6.11", features = ["fs", "trace"] }
axum = "0.8.9"
regex = "1.13.2"
url = "2.5.8"
tracing-appender = "0.2.5"
humantime-serde = "1.1.1"
strfmt = "0.2.6"
ipnet = { version = "2.12.2", features = ["std", "serde", "json"] }
pingora-timeout = "0.9.1"
